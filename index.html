<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
#gueux-bar{position:fixed;top:0;left:0;right:0;z-index:9999;background:#000;border-bottom:1px solid #D4AF37;display:flex;gap:8px;align-items:center;padding:8px 12px;font-family:Inter,system-ui,sans-serif;flex-wrap:wrap}
#gueux-bar button{border:1px solid #D4AF37;background:#111;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
#gueux-bar button.gold{background:#D4AF37;color:#000}
#gueux-panel{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.82);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:70px 12px 30px}
#gueux-panel.open{display:flex}
.gx-card{background:#0A0A0A;border:1px solid #2a2a2a;border-radius:20px;color:#fff;width:min(980px,100%);padding:20px;font-family:Inter,system-ui,sans-serif}
.gx-card h2{font-family:Georgia,serif;font-size:28px;margin:0 0 6px}.gx-muted{color:#bbb;font-size:13px;line-height:1.6}
.gx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}@media(max-width:700px){.gx-grid{grid-template-columns:1fr}}
.gx-opt{border:1px solid #333;border-radius:16px;padding:16px;cursor:pointer;background:#111}.gx-opt.sel{border-color:#D4AF37;background:#1a1505}
.gx-input{width:100%;background:#111;border:1px solid #333;color:#fff;border-radius:12px;padding:12px;margin-top:8px}
.gx-btn{background:#D4AF37;color:#000;border:0;border-radius:999px;padding:12px 16px;font-weight:800;width:100%;cursor:pointer;margin-top:12px}
.gx-btn:disabled{opacity:.5}.gx-item{border:1px solid #222;border-radius:16px;overflow:hidden;background:#111}.gx-item img{width:100%;height:180px;object-fit:cover;background:#222}
#gx-map{height:360px;border-radius:16px;border:1px solid #333;z-index:1}
.gx-pill{display:inline-block;background:#D4AF37;color:#000;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800}
.gx-progress{height:10px;background:#222;border-radius:999px;overflow:hidden}.gx-progress i{display:block;height:100%;background:#D4AF37}
body{padding-top:46px!important}

<div id="gueux-bar">
  <b style="color:#D4AF37;font-family:Georgia,serif;letter-spacing:2px">GUEUX</b>
  <span id="gx-who" style="color:#fff;font-size:12px">Not logged in — please login as Buyer or Seller</span>
  <span id="gx-trial" class="gx-pill" style="margin-left:auto">FREE TRIAL · 0 / 30 uploads</span>
  <button onclick="GX.open('auth')">Login / Switch Role</button>
  <button class="gold" onclick="GX.open('market')">Marketplace · Prices · Seller Map</button>
  <button onclick="GX.open('upload')">Seller Upload (Trial)</button>
</div>
<div id="gueux-panel"><div class="gx-card" id="gx-card"></div></div>
<script>
const GX={};
GX.SELLERS=[
 {id:1,name:"Adaeze Ankara House",city:"Wuse 2, Abuja",area:"Abuja",lat:9.066, lng:7.483,phone:"+234 803 000 0001"},
 {id:2,name:"Lagos Drip Atelier",city:"Lekki Phase 1, Lagos",area:"Lagos",lat:6.447, lng:3.472,phone:"+234 803 000 0002"},
 {id:3,name:"Kano Royal Fabrics",city:"Kano City, Kano",area:"Kano",lat:11.996, lng:8.517,phone:"+234 803 000 0003"},
 {id:4,name:"Port Harcourt Styles",city:"GRA, Port Harcourt",area:"Rivers",lat:4.815, lng:7.049,phone:"+234 803 000 0004"},
 {id:5,name:"Enugu Luxe Tailors",city:"Independence Layout, Enugu",area:"Enugu",lat:6.452, lng:7.510,phone:"+234 803 000 0005"},
];
GX.ITEMS=[
 {name:"Royal Blue-Gold Ankara Gown",price:45000,usd:30,seller:1,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80",cat:"Gown"},
 {name:"Gold Damask Ankara 2-Piece",price:38000,usd:25,seller:1,img:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&q=80",cat:"2-Piece"},
 {name:"Lagos Street Drip Set",price:52000,usd:35,seller:2,img:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800&q=80",cat:"Streetwear"},
 {name:"Kano Royal Boubou",price:60000,usd:40,seller:3,img:"https://images.unsplash.com/photo-1509631179647-0177331693ae?w=800&q=80",cat:"Boubou"},
 {name:"PH Ankara Maxi Dress",price:42000,usd:28,seller:4,img:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=800&q=80",cat:"Dress"},
 {name:"Enugu Ankara Blazer Set",price:58000,usd:39,seller:5,img:"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=800&q=80",cat:"Blazer"},
];
GX.get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
GX.set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
GX.user=()=>GX.get('gueux_user',null);
GX.count=()=>GX.get('gueux_trial_count',0);
GX.myItems=()=>GX.get('gueux_my_uploads',[]);
GX.renderBar=()=>{
 const u=GX.user(); const c=GX.count();
 document.getElementById('gx-who').textContent=u?`Logged in as ${u.role.toUpperCase()} · ${u.name} · ${u.city||''}`:'Not logged in — please login as Buyer or Seller';
 document.getElementById('gx-trial').textContent=`FREE TRIAL · ${c} / 30 uploads ${c>=30?'· TRIAL USED UP':''}`;
};
GX.open=(view)=>{
 const p=document.getElementById('gueux-panel'); p.classList.add('open');
 if(view==='auth') GX.authView(); if(view==='market') GX.marketView(); if(view==='upload') GX.uploadView();
};
GX.close=()=>document.getElementById('gueux-panel').classList.remove('open');
GX.authView=()=>{
 const u=GX.user();
 document.getElementById('gx-card').innerHTML=`<button onclick="GX.close()" style="float:right;background:#222;color:#fff;border:0;border-radius:999px;padding:8px 12px;cursor:pointer"> Close</button>
 <h2>Login as Buyer or Seller</h2><p class="gx-muted">You can only use GUEUX as a <b>Buyer</b> (shop clothes, see prices + seller location) or a <b>Seller</b> (upload clothes — free trial limited to 30 clothes). Pick one to continue.</p>
 <div class="gx-grid"><div class="gx-opt" id="opt-buyer" onclick="GX.pick('Buyer')"><b> Buyer</b><p class="gx-muted">Browse marketplace, see price in ₦ / $, seller name, city + map. Buy via WhatsApp.</p></div>
 <div class="gx-opt" id="opt-seller" onclick="GX.pick('Seller')"><b> Seller</b><p class="gx-muted">Upload up to <b>30 clothes FREE</b> on trial. After 30, upgrade to a paid plan to upload more.</p></div></div>
 <input id="gx-name" class="gx-input" placeholder="Your full name" value="${u?.name||''}">
 <input id="gx-city" class="gx-input" placeholder="Your city / area e.g. Wuse 2, Abuja" value="${u?.city||''}">
 <input id="gx-phone" class="gx-input" placeholder="WhatsApp / phone e.g. +234 ..." value="${u?.phone||''}">
 <button class="gx-btn" onclick="GX.login()">Continue as <span id="gx-role-label">${u?.role||'Buyer'}</span> -></button>
 <p class="gx-muted" style="margin-top:10px">Demo login — saved only in this browser. No password needed for this demo. In production, connect this to Supabase Auth.</p>`;
 GX._role=u?.role||'Buyer'; GX.highlight();
};
GX.pick=(r)=>{GX._role=r; document.getElementById('gx-role-label').textContent=r; GX.highlight();};
GX.highlight=()=>{document.getElementById('opt-buyer')?.classList.toggle('sel',GX._role==='Buyer'); document.getElementById('opt-seller')?.classList.toggle('sel',GX._role==='Seller');};
GX.login=()=>{
 const name=document.getElementById('gx-name').value.trim(), city=document.getElementById('gx-city').value.trim(), phone=document.getElementById('gx-phone').value.trim();
 if(!name||!city) return alert('Please enter your name and city.');
 GX.set('gueux_user',{name,city,phone,role:GX._role}); GX.renderBar(); GX.close(); alert(`Welcome, ${name}! You are logged in as ${GX._role}.`); if(GX._role==='Seller') GX.open('upload'); else GX.open('market');
};
GX.require=(role)=>{const u=GX.user(); if(!u){alert('Please login first — choose Buyer or Seller.'); GX.open('auth'); return false;} if(role && u.role!==role){alert(`This is for ${role}s only. You are logged in as ${u.role}. Switch role in Login.`); GX.open('auth'); return false;} return true;};
GX.marketView=()=>{
 if(!GX.require()) return;
 const all=[...GX.ITEMS, ...GX.myItems()];
 const cards=all.map((it,i)=>{const s=GX.SELLERS.find(x=>x.id===it.seller)||{name:it.sellerName||'Your Store',city:it.sellerCity||'Abuja'}; return `<div class="gx-item"><img src="${it.img}"><div style="padding:12px"><b>${it.name}</b><p class="gx-muted">${it.cat||'Clothes'} · Seller: ${s.name}</p><p style="margin:6px 0"><b style="color:#D4AF37;font-size:18px">₦${Number(it.price).toLocaleString()}</b> <span class="gx-muted">· $${it.usd||Math.round(it.price/1500)}</span></p><p class="gx-muted"> ${s.city} · <a href="#" onclick="GX.focusSeller(${s.lat||9.066},${s.lng||7.483});return false" style="color:#D4AF37">View on map ↓</a></p><button class="gx-btn" onclick="GX.buy('${it.name.replace(/'/g,'')}','${s.name}','${s.phone||''}')">Buy / Chat Seller on WhatsApp</button></div></div>`}).join('');
 document.getElementById('gx-card').innerHTML=`<button onclick="GX.close()" style="float:right;background:#222;color:#fff;border:0;border-radius:999px;padding:8px 12px;cursor:pointer"> Close</button>
 <h2>Marketplace — Prices + Seller Locations</h2><p class="gx-muted">Every item shows its <b>price (₦ + $)</b>, <b>seller</b> and <b>location</b>. Tap a seller to jump to them on the map. Buyers buy, Sellers manage uploads.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><input id="gx-q" class="gx-input" style="flex:1;margin:0" placeholder="Search e.g. Ankara gown, Lagos..." oninput="GX.filter()"><select id="gx-cityf" class="gx-input" style="width:180px;margin:0" onchange="GX.filter()"><option value="">All cities</option>${GX.SELLERS.map(s=>`<option>${s.area}</option>`).join('')}</select></div>
 <div id="gx-map" style="margin-top:12px"></div><p class="gx-muted"> Map: pins = sellers. Tap a pin for name, city + phone. Allow location in your browser to see distance — demo pins are in Abuja, Lagos, Kano, Port Harcourt & Enugu.</p>
 <div class="gx-grid" id="gx-list" style="margin-top:12px">${cards}</div>`;
 GX.initMap();
};
GX.initMap=()=>{
 setTimeout(()=>{
  const map=L.map('gx-map').setView([9.082,7.495],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  GX.SELLERS.forEach(s=>{ L.marker([s.lat,s.lng]).addTo(map).bindPopup(`<b>${s.name}</b><br>${s.city}<br>${s.phone}`); });
  GX._map=map;
 },150);
};
GX.focusSeller=(lat,lng)=>{ if(GX._map){GX._map.setView([lat,lng],13); window.scrollTo({top:0}); document.getElementById('gx-map').scrollIntoView({behavior:'smooth'});} };
GX.buy=(name,seller,phone)=>{ const u=GX.user(); if(u?.role!=='Buyer') return alert('Only Buyers can buy. Login as Buyer to buy.'); const msg=encodeURIComponent(`Hi ${seller}, I want to buy "${name}" on GUEUX. I'm ${u.name} from ${u.city}.`); window.open(`https://wa.me/${(phone||'2348030000001').replace(/[^0-9]/g,'')}?text=${msg}`,'_blank'); };
GX.filter=()=>{
 const q=(document.getElementById('gx-q').value||'').toLowerCase(), city=document.getElementById('gx-cityf').value;
 document.querySelectorAll('#gx-list .gx-item').forEach(el=>{ el.style.display=(el.textContent.toLowerCase().includes(q)&&( !city||el.textContent.includes(city)))?'':'none'; });
};
GX.uploadView=()=>{
 if(!GX.require('Seller')) return;
 const c=GX.count(), left=30-c, mine=GX.myItems();
 document.getElementById('gx-card').innerHTML=`<button onclick="GX.close()" style="float:right;background:#222;color:#fff;border:0;border-radius:999px;padding:8px 12px;cursor:pointer"> Close</button>
 <h2>Seller Upload — Free Trial</h2><p class="gx-muted">Free trial: <b>upload only 30 clothes</b>. You have used <b>${c} / 30</b> — <b>${left} left</b>.</p>
 <div class="gx-progress" style="margin-top:10px"><i style="width:${(c/30*100)}%"></i></div>
 ${c>=30?`<p style="background:#3a1a1a;border:1px solid #ff5555;border-radius:12px;padding:12px;margin-top:12px"> Trial used up — you uploaded 30 clothes. Upgrade to a paid plan to upload more. Your 30 clothes stay live.</p><button class="gx-btn" onclick="alert('Upgrade: connect your Selar / Paystack paid plan link here.')">Upgrade to Upload More -></button>`:`
 <input id="up-name" class="gx-input" placeholder="Clothes name e.g. Red Ankara Gown">
 <input id="up-price" class="gx-input" type="number" placeholder="Price in ₦ e.g. 45000">
 <input id="up-city" class="gx-input" placeholder="Your shop location e.g. Wuse 2, Abuja" value="${GX.user()?.city||''}">
 <input id="up-img" class="gx-input" placeholder="Photo URL (or leave blank for demo photo)">
 <button class="gx-btn" onclick="GX.doUpload()">Upload Clothes (${left} trial slots left)</button>`}
 <h3 style="margin-top:18px">Your uploaded clothes (${mine.length})</h3><div class="gx-grid">${mine.map(m=>`<div class="gx-item"><img src="${m.img}"><div style="padding:12px"><b>${m.name}</b><p style="color:#D4AF37"><b>₦${Number(m.price).toLocaleString()}</b> · $${m.usd}</p><p class="gx-muted"> ${m.sellerCity}</p></div></div>`).join('')||'<p class="gx-muted">No uploads yet.</p>'}</div>`;
};
GX.doUpload=()=>{
 const c=GX.count(); if(c>=30) return alert('Trial used up — 30 / 30. Upgrade to upload more.');
 const name=document.getElementById('up-name').value.trim(), price=Number(document.getElementById('up-price').value), city=document.getElementById('up-city').value.trim(), img=document.getElementById('up-img').value.trim()||'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80';
 if(!name||!price||!city) return alert('Fill name, price (₦) and location.');
 const u=GX.user(); const mine=GX.myItems(); mine.push({name,price,usd:Math.round(price/1500),seller:99,sellerName:u.name+' Store',sellerCity:city,img,cat:'Clothes'});
 GX.set('gueux_my_uploads',mine); GX.set('gueux_trial_count',c+1); GX.renderBar(); alert(`Uploaded! ${c+1} / 30 used. ${29-c} trial slots left.`); GX.uploadView();
};
GX.renderBar();
// Force login gate on first visit
if(!GX.user()){ setTimeout(()=>GX.open('auth'),600); }
// Block original upload buttons for sellers over trial — warn
document.addEventListener('click',e=>{ const t=e.target.closest('button'); if(t && /upload|generate|create/i.test(t.textContent||'')){ const u=GX.user(); if(u?.role==='Seller' && GX.count()>=30){ e.preventDefault(); e.stopPropagation(); alert('Free trial used up — 30 / 30 clothes uploaded. Upgrade to upload more.'); } } },true);
</script>
<!-- ===== END ADDED FEATURES ===== -->

<style>
.gx2-bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.gx2-bar button,.gx2-chip{border:1px solid #333;background:#111;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}
.gx2-bar button.on{background:#D4AF37;color:#000;border-color:#D4AF37;font-weight:800}
.gx2-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#D4AF37;color:#000;padding:10px 16px;border-radius:999px;font-weight:800;z-index:10001;font-family:Inter,sans-serif;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.gx2-toast.show{display:block}
.gx2-notif{position:fixed;top:52px;right:12px;z-index:10001;background:#111;border:1px solid #D4AF37;color:#fff;border-radius:14px;padding:10px 12px;width:280px;font-family:Inter,sans-serif;font-size:12px;display:none}
.gx2-modal{position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,.85);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:70px 12px 30px}
.gx2-modal.open{display:flex}
.gx2-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1f1f1f}
.gx2-stars{color:#D4AF37;letter-spacing:2px}
.gx2-badge{background:#0f2a1a;color:#4ade80;border:1px solid #22c55e;border-radius:999px;padding:2px 8px;font-size:11px}
.gx2-wallet{background:linear-gradient(135deg,#D4AF37,#fff2b0);color:#000;border-radius:16px;padding:16px}
</style>
<div id="gx2-toast" class="gx2-toast"></div>
<div id="gx2-notif" class="gx2-notif"></div>
<div id="gx2-modal" class="gx2-modal"><div class="gx-card" id="gx2-card"></div></div>
<script>
// ===== 34 FEATURES =====
const GX2={};
GX2.toast=(m)=>{const t=document.getElementById('gx2-toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)};
GX2.get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
GX2.set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
GX2.cart=()=>GX2.get('gx_cart',[]); GX2.wish=()=>GX2.get('gx_wish',[]); GX2.orders=()=>GX2.get('gx_orders',[]); GX2.reviews=()=>GX2.get('gx_reviews',{}); GX2.follows=()=>GX2.get('gx_follows',[]); GX2.viewed=()=>GX2.get('gx_viewed',[]); GX2.chats=()=>GX2.get('gx_chats',[]); GX2.notifs=()=>GX2.get('gx_notifs',[]);
GX2.currency=()=>GX2.get('gx_currency','NGN'); GX2.lang=()=>GX2.get('gx_lang','EN');
GX2.fmt=(naira)=> GX2.currency()==='USD' ? `$${(naira/1500).toFixed(0)}` : `₦${Number(naira).toLocaleString()}`;
GX2.rate=(name)=>{const r=GX2.reviews()[name]; if(!r||!r.length) return 4.5; return (r.reduce((a,b)=>a+b.stars,0)/r.length).toFixed(1)};
GX2.notify=(m)=>{const n=GX2.notifs(); n.unshift({m,t:new Date().toLocaleString()}); GX2.set('gx_notifs',n.slice(0,20)); const el=document.getElementById('gx2-notif'); el.innerHTML=`<b> ${m}</b><br><small>${new Date().toLocaleString()}</small><br><button onclick="document.getElementById('gx2-notif').style.display='none'" style="margin-top:6px;background:#D4AF37;border:0;border-radius:999px;padding:5px 10px;font-weight:800;cursor:pointer">OK</button>`; el.style.display='block'; setTimeout(()=>el.style.display='none',5000)};
GX2.addCart=(name,price)=>{const c=GX2.cart(); c.push({name,price,qty:1,size:GX2._size||'M',color:GX2._color||'As shown',at:Date.now()}); GX2.set('gx_cart',c); GX2.toast(`Added to cart: ${name}`); GX2.notify(`Added to cart: ${name}`); GX2.updateBadges()};
GX2.toggleWish=(name)=>{let w=GX2.wish(); w=w.includes(name)?w.filter(x=>x!==name):[...w,name]; GX2.set('gx_wish',w); GX2.toast(w.includes(name)?` Saved: ${name}`:`Removed from wishlist: ${name}`); GX2.updateBadges(); if(document.getElementById('gx2-card')) GX2.renderMarketExtra();};
GX2.updateBadges=()=>{const b=document.getElementById('gx2-badges'); if(b) b.textContent=` Cart ${GX2.cart().length} ·  Wishlist ${GX2.wish().length} ·  Orders ${GX2.orders().length} ·  ${GX2.notifs().length}`};
GX2.open2=(html)=>{document.getElementById('gx2-card').innerHTML=`<button onclick="GX2.close2()" style="float:right;background:#222;color:#fff;border:0;border-radius:999px;padding:8px 12px;cursor:pointer"> Close</button>`+html; document.getElementById('gx2-modal').classList.add('open')};
GX2.close2=()=>document.getElementById('gx2-modal').classList.remove('open');
GX2.checkout=()=>{
 const c=GX2.cart(); if(!c.length) return GX2.toast('Cart is empty');
 const promo=GX2.get('gx_promo',0); const sub=c.reduce((a,b)=>a+b.price*b.qty,0); const disc=Math.round(sub*promo/100); const delivery=GX2._delivery==='Express'?5000:GX2._delivery==='Pickup'?0:2500; const total=sub-disc+delivery;
 const id='GX-'+Math.floor(1000+Math.random()*9000);
 const o=GX2.orders(); o.unshift({id,items:c,total,delivery:GX2._delivery||'Standard',status:'Processing',at:new Date().toLocaleString(),address:GX2.get('gx_address','')});
 GX2.set('gx_orders',o); GX2.set('gx_cart',[]); GX2.notify(`Order ${id} placed! Total ${GX2.fmt(total)} — ${GX2._delivery||'Standard'} delivery`); GX2.open2(`<h2> Order Placed!</h2><p class="gx-muted">Order <b>${id}</b> · Total <b>${GX2.fmt(total)}</b> (Subtotal ${GX2.fmt(sub)} − Promo ${promo}% = −${GX2.fmt(disc)} + Delivery ${GX2.fmt(delivery)})</p><p class="gx-muted">Status: <b>Processing -> Tailoring -> Shipped -> Delivered</b>. You can track it in Orders.</p><button class="gx-btn" onclick="GX2.showOrders()">Track My Order -></button>`);
};
// Inject 34-features toolbar into GUEUX bar
setTimeout(()=>{
 const bar=document.getElementById('gueux-bar'); if(bar && !document.getElementById('gx2-badges')){
   const d=document.createElement('div'); d.style.cssText='width:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center';
   d.innerHTML=`<span id="gx2-badges" style="color:#fff;font-size:11px"></span>
   <button onclick="GX2.showCart()"> Cart</button><button onclick="GX2.showWish()"> Wishlist</button><button onclick="GX2.showOrders()"> Orders / Track</button><button onclick="GX2.showSellerDash()"> Seller Dashboard</button><button onclick="GX2.showWallet()"> Wallet / Payout</button><button onclick="GX2.showChat()"> Messages</button><button onclick="GX2.showSettings()"> Settings</button><button onclick="GX2.showHelp()"> Help / Returns</button>`;
   bar.appendChild(d); GX2.updateBadges();
 }
},800);
// --- Feature screens ---
GX2.showCart=()=>{const c=GX2.cart(); GX2.open2(`<h2> Your Cart</h2>${c.length?c.map((it,i)=>`<div class="gx2-row"><span><b>${it.name}</b><br><small>${it.size} · ${it.color} · Qty ${it.qty}</small></span><span><b>${GX2.fmt(it.price*it.qty)}</b><br><button onclick="GX2.removeCart(${i})" style="background:#222;color:#fff;border:0;border-radius:999px;padding:4px 8px;cursor:pointer">Remove</button></span></div>`).join(''):'<p class="gx-muted">Cart is empty. Add items from Marketplace.</p>'}
 <p class="gx-muted"><b>Delivery:</b></p><div class="gx2-bar"><button class="${GX2._delivery!=='Express'&&GX2._delivery!=='Pickup'?'on':''}" onclick="GX2._delivery='Standard';GX2.showCart()">Standard ₦2,500 · 3-5 days</button><button class="${GX2._delivery==='Express'?'on':''}" onclick="GX2._delivery='Express';GX2.showCart()">Express ₦5,000 · 24h</button><button class="${GX2._delivery==='Pickup'?'on':''}" onclick="GX2._delivery='Pickup';GX2.showCart()">Pickup FREE · At seller shop</button></div>
 <input id="gx-promo" class="gx-input" placeholder="Promo code — try GUEUX10 or ABUJA20"><button class="gx-btn" style="background:#111;color:#fff;border:1px solid #D4AF37" onclick="GX2.applyPromo()">Apply Promo</button>
 <input id="gx-addr" class="gx-input" placeholder="Delivery address e.g. Wuse 2, Abuja" value="${GX2.get('gx_address','')}"><button class="gx-btn" onclick="GX2.set('gx_address',document.getElementById('gx-addr').value);GX2.checkout()">Checkout · ${GX2.fmt(c.reduce((a,b)=>a+b.price*b.qty,0))} -></button>

const _gxUploadPic = GX.uploadView;
GX.uploadView=function(){
  _gxUploadPic();
  setTimeout(()=>{
    const card=document.getElementById('gx-card'); if(!card) return;
    if(document.getElementById('gx-photo-box')) return;
    // Find the photo URL input and replace it with a proper photo picker + keep URL as fallback
    const urlInput=document.getElementById('up-img');
    const box=document.createElement('div');
    box.id='gx-photo-box'; box.className='gx-photo-box'; box.onclick=GX_TAKE_PHOTO;
    box.innerHTML='<b>Tap to Add Product Photo</b><p id="gx-photo-text">Same as clothes - take a photo or pick from gallery. Shoes, watches, caps, bags, all need a clear photo.</p><img id="gx-photo-preview" alt="Product photo preview"><input id="gx-photo-input" type="file" accept="image/*" capture="environment" style="display:none" onchange="GX_PICK_PHOTO(this)"><p style="margin-top:8px;font-size:12px">Tip: Take it in daylight, plain background, show the full product.</p>';
    if(urlInput){ urlInput.parentNode.insertBefore(box, urlInput); urlInput.placeholder='Or paste photo link (optional) - if you already added a photo above, leave this empty'; }
    else { const btn=card.querySelector('.gx-btn'); if(btn) btn.parentNode.insertBefore(box, btn); }
    window.GX_UP_IMG='';
    // Patch doUpload once to use uploaded photo first
    if(!GX._patchedPhoto){
      GX._patchedPhoto=true;
      const origDo2=GX.doUpload;
      GX.doUpload=function(){
        const before=GX.myItems().length;
        // Temporarily set URL field to uploaded photo so original logic picks it up
        const urlField=document.getElementById('up-img');
        if(window.GX_UP_IMG && urlField){ urlField.value=window.GX_UP_IMG; }
        origDo2();
        // If upload succeeded, ensure saved item uses the photo
        const mine=GX.myItems(); if(mine.length>before && window.GX_UP_IMG){ mine[mine.length-1].img=window.GX_UP_IMG; GX.set('gueux_my_uploads',mine); }
        window.GX_UP_IMG='';
      };
    }
  },400);
};
// Also patch Marketplace cards: if image fails, show placeholder with product name
document.addEventListener('error',function(e){
  const t=e.target; if(t && t.tagName==='IMG' && t.closest && t.closest('.gx-item')){
    t.style.background='#E8E0CE'; t.alt='Product photo';
    // Replace broken image with a clean placeholder div text via onerror once
    if(!t.dataset.fixed){ t.dataset.fixed='1'; t.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400"><rect width="100%" height="100%" fill="#F2EEDF"/><text x="50%" y="50%" font-family="Georgia" font-size="28" fill="#0B0B0F" text-anchor="middle">GUEUX - Product Photo</text></svg>'); }
  }
},true);
// Patch Easy Seller flow to mention photo
setTimeout(()=>{
  try{
    const origDone=GX_EASY.done;
    // keep as is, just ensure photo tip is shown in help
  }catch(e){}
},500);
console.log('GUEUX PICTURES: photo upload enabled for all products');
</script>
